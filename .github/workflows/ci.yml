name: CI

# Runs on every pull request and on every push to main. Results appear in the PR's "Checks" tab.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests and data validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest -q

      # Freeze rules, because gold-v1 is frozen: counts and verification must hold. (A step name must not contain
      # ": " unquoted, or GitHub rejects the whole workflow file and runs no job; tests/test_ci_workflow.py checks.)
      - name: Validate gold set (freeze rules)
        run: python eval/validate_gold.py --final

      - name: Validate refusal and prompt-injection test sets (final rules, every test verified by a second person)
        run: python eval/validate_test_sets.py --final

      # Final rules, because every item is verified: format, the split, second-person verification and separation
      # from gold-v1 (no shared filing period or company-year, no reworded gold or test question)
      - name: Validate development set (final rules, no overlap with gold-v1)
        run: python eval/validate_dev_set.py --final

      # The development set v2 (W3-02): final rules too, as every item is verified (format, its split, second-person
      # verification, separation from gold-v1 and from v1)
      - name: Validate development set v2 (final rules, no overlap with gold-v1 or v1)
        run: python eval/validate_dev_set.py eval/dev_set_v2.jsonl --final
