# FinSight corpus scope: the single source of truth for which companies and filings are in scope.
# Used by: WP2 (download + parse), WP3 (XBRL facts), WP4 (gold set), and later the agent's scope checks.
# Changes need team agreement and an entry in docs/decisions.md (see the "Change rule" in the header of docs/spec.md).
schema_version: 2

# Fiscal years are the COMPANY'S OWN fiscal-year labels (as tagged in its XBRL filings), not calendar years.
# See docs/spec.md §4. Example: Apple FY2025 = Oct 2024 – Sep 2025.
# Original filings only: 10-K/A and 10-Q/A amendments are not indexed as text (docs/spec.md §3).
forms:
  "10-K":
    fiscal_years: [2023, 2024, 2025]   # one annual report per fiscal year
  "10-Q":
    fiscal_years: [2025]               # the Q1–Q3 reports of fiscal 2025 (Q4 is covered by the 10-K)
    fiscal_periods: [Q1, Q2, Q3]

# Per company:
#   cik                    SEC Central Index Key, zero-padded to 10 digits as used by data.sec.gov URLs.
#   fiscal_year_end        when the fiscal year ends ("52/53-week" = ends on a weekday near that date).
#   fiscal_year_end_month  month the fiscal year USUALLY ends (1–12), for code. 52/53-week years can end a few
#                          days into the next month (J&J FY2022 ended 1 Jan 2023), so never derive the fiscal-year
#                          label from a period-end date; use the XBRL fy/fp labels.
#   aliases                names users type, matched case-insensitively as whole words by the planner (a one-word
#                          name only when not all in lower case: "chase growth" is not JPMorgan). Bare
#                          tickers also match, but only when written in capitals (so the ticker "C" never matches
#                          the letter "c").
companies:
