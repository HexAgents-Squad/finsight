[project]
name = "finsight"
version = "1.0.0"
description = "Multi-agent copilot for SEC 10-K/10-Q filings with citations and verified calculations"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
# W3-07: a test that reads the whole downloaded corpus takes minutes; it runs only with `pytest --corpus` (tests/conftest.py)
markers = ["corpus: scans the whole downloaded corpus (minutes); skipped unless pytest is given --corpus"]
# langsmith (a langgraph dependency) calls asyncio.iscoroutinefunction, deprecated from Python 3.14
filterwarnings = ["ignore:.asyncio.iscoroutinefunction. is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]   # long lines are allowed in data tables and messages; the formatter width is 110
